x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-100m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  backend:
    image: ${MAGPIE_BACKEND_IMAGE:-kuuchen/magpie-backend}:${MAGPIE_BACKEND_TAG:-${MAGPIE_IMAGE_TAG:-latest}}
    container_name: magpie_backend
    command:
      - -rod=bin=/usr/lib/chromium/chromium
    ports:
      - "5656:5656"
      - "20000-20100:20000-20100"
      - "20000-20100:20000-20100/udp"
    environment:
      - PROXY_ENCRYPTION_KEY=${PROXY_ENCRYPTION_KEY:?Set PROXY_ENCRYPTION_KEY in .env}
      - PROXY_QUEUE_ENCRYPT_CREDENTIALS=${PROXY_QUEUE_ENCRYPT_CREDENTIALS:-false}
      - JWT_SECRET=${JWT_SECRET:-magpie-local-compose-jwt-secret-2026}
      - redisUrl=${REDIS_URL:-redis://redis:6379}
      - REDIS_MODE=${REDIS_MODE:-single}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-magpie-master}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}
      - PROXY_EXPORT_TIMEOUT_SECONDS=${PROXY_EXPORT_TIMEOUT_SECONDS:-300}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-magpie}
      - DB_USERNAME=${DB_USERNAME:-magpie_user}
      - DB_PASSWORD=${DB_PASSWORD:-ChangeMeToAStrongDbPassword}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-false}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - PASSWORD_RESET_TOKEN_TTL_MINUTES=${PASSWORD_RESET_TOKEN_TTL_MINUTES:-}
      - WORKSPACE_INVITATION_TTL_HOURS=${WORKSPACE_INVITATION_TTL_HOURS:-168}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5050,http://127.0.0.1:5050,http://localhost:4200,http://127.0.0.1:4200}
      - DISABLE_PUBLIC_REGISTRATION=${DISABLE_PUBLIC_REGISTRATION:-false}
      - ENABLE_PUBLIC_FIRST_ADMIN_BOOTSTRAP=${ENABLE_PUBLIC_FIRST_ADMIN_BOOTSTRAP:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_browser_cache:/home/nonroot/.cache/rod
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.00}"
          memory: "${BACKEND_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${BACKEND_CPU_RESERVATION:-0.50}"
          memory: "${BACKEND_MEMORY_RESERVATION:-256M}"
    logging: *default-logging
    restart: unless-stopped

  frontend:
    image: ${MAGPIE_FRONTEND_IMAGE:-kuuchen/magpie-frontend}:${MAGPIE_FRONTEND_TAG:-${MAGPIE_IMAGE_TAG:-latest}}
    container_name: magpie_frontend
    environment:
      - EXPORT_PROXY_READ_TIMEOUT_SECONDS=${EXPORT_PROXY_READ_TIMEOUT_SECONDS:-310}
    ports:
      - "5050:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-1.00}"
          memory: "${FRONTEND_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${FRONTEND_CPU_RESERVATION:-0.25}"
          memory: "${FRONTEND_MEMORY_RESERVATION:-128M}"
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: magpie_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-magpie_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMeToAStrongDbPassword}
      POSTGRES_DB: ${DB_NAME:-magpie}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.50}"
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION:-0.50}"
          memory: "${POSTGRES_MEMORY_RESERVATION:-256M}"
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: magpie_redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --masterauth "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:8946:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.00}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_MEMORY_RESERVATION:-128M}"
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_browser_cache:
