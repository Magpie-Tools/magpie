x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-100m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  backend-volume-init:
    image: alpine:3.23
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        chown -R 65532:65532 /app/data /browser-cache
        chmod 700 /app/data /browser-cache
    volumes:
      - backend_data:/app/data
      - backend_browser_cache:/browser-cache
    restart: "no"

  backend:
    image: ${MAGPIE_BACKEND_IMAGE:-kuuchen/magpie-backend}:${MAGPIE_BACKEND_TAG:-${MAGPIE_IMAGE_TAG:-latest}}
    container_name: magpie_backend
    command:
      - -rod=bin=/usr/lib/chromium/chromium
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:5656:5656"
      - "20000-20100:20000-20100"
      - "20000-20100:20000-20100/udp"
    environment:
      - MAGPIE_ENV=${MAGPIE_ENV:-development}
      - STRICT_SECRET_VALIDATION=${STRICT_SECRET_VALIDATION:-}
      - DEVELOPMENT_FIXTURES=${DEVELOPMENT_FIXTURES:-false}
      - PROXY_ENCRYPTION_KEY=${PROXY_ENCRYPTION_KEY:?Set PROXY_ENCRYPTION_KEY in .env}
      - PROXY_QUEUE_ENCRYPT_CREDENTIALS=${PROXY_QUEUE_ENCRYPT_CREDENTIALS:-false}
      - PROXY_STATISTICS_RETENTION_DAYS=${PROXY_STATISTICS_RETENTION_DAYS:-30}
      - PROXY_STATISTICS_RESPONSE_RETENTION_DAYS=${PROXY_STATISTICS_RESPONSE_RETENTION_DAYS:-7}
      - PROXY_STATISTICS_RETENTION_INTERVAL=${PROXY_STATISTICS_RETENTION_INTERVAL:-}
      - PROXY_STATISTICS_RETENTION_INTERVAL_MINUTES=${PROXY_STATISTICS_RETENTION_INTERVAL_MINUTES:-5}
      - PROXY_STATISTICS_RETENTION_BATCH_SIZE=${PROXY_STATISTICS_RETENTION_BATCH_SIZE:-50000}
      - PROXY_STATISTICS_RETENTION_MAX_BATCHES=${PROXY_STATISTICS_RETENTION_MAX_BATCHES:-240}
      - PROXY_STATISTICS_PARTITION_PRECREATE_MONTHS=${PROXY_STATISTICS_PARTITION_PRECREATE_MONTHS:-2}
      - PROXY_DAILY_CHECK_RETENTION_DAYS=${PROXY_DAILY_CHECK_RETENTION_DAYS:-30}
      - PROXY_ORPHAN_CLEAN_INTERVAL=${PROXY_ORPHAN_CLEAN_INTERVAL:-}
      - PROXY_ORPHAN_CLEAN_INTERVAL_MINUTES=${PROXY_ORPHAN_CLEAN_INTERVAL_MINUTES:-60}
      - PROXY_ORPHAN_CLEAN_MAX_RUN_DURATION=${PROXY_ORPHAN_CLEAN_MAX_RUN_DURATION:-45s}
      - PROXY_ORPHAN_CLEAN_RETRY_INTERVAL=${PROXY_ORPHAN_CLEAN_RETRY_INTERVAL:-1m}
      - PROXY_STATISTICS_LEDGER_RETENTION_BATCH_SIZE=${PROXY_STATISTICS_LEDGER_RETENTION_BATCH_SIZE:-50000}
      - PROXY_STATISTICS_LEDGER_RETENTION_MAX_BATCHES=${PROXY_STATISTICS_LEDGER_RETENTION_MAX_BATCHES:-240}
      - ROTATING_PROXY_MAX_CONCURRENT_TUNNELS=${ROTATING_PROXY_MAX_CONCURRENT_TUNNELS:-1024}
      - ROTATING_PROXY_HTTP3_TLS_CERT_FILE=${ROTATING_PROXY_HTTP3_TLS_CERT_FILE:-}
      - ROTATING_PROXY_HTTP3_TLS_KEY_FILE=${ROTATING_PROXY_HTTP3_TLS_KEY_FILE:-}
      - EMAIL_OUTBOX_RETENTION_HOURS=${EMAIL_OUTBOX_RETENTION_HOURS:-24}
      - PROXY_REPUTATION_REFRESH_WORKERS=${PROXY_REPUTATION_REFRESH_WORKERS:-4}
      - PROXY_REPUTATION_REFRESH_BATCH_SIZE=${PROXY_REPUTATION_REFRESH_BATCH_SIZE:-1000}
      - PROXY_REPUTATION_REFRESH_INTERVAL_SECONDS=${PROXY_REPUTATION_REFRESH_INTERVAL_SECONDS:-1}
      - SCRAPE_SOURCE_STATS_REFRESH_INTERVAL_SECONDS=${SCRAPE_SOURCE_STATS_REFRESH_INTERVAL_SECONDS:-30}
      - SCRAPE_SOURCE_STATS_REFRESH_BATCH_SIZE=${SCRAPE_SOURCE_STATS_REFRESH_BATCH_SIZE:-100}
      - READ_MODEL_REFRESH_INTERVAL_SECONDS=${READ_MODEL_REFRESH_INTERVAL_SECONDS:-5}
      - READ_MODEL_REFRESH_BATCH_SIZE=${READ_MODEL_REFRESH_BATCH_SIZE:-5000}
      - READ_MODEL_REFRESH_MAX_BATCHES=${READ_MODEL_REFRESH_MAX_BATCHES:-4}
      - READ_MODEL_REFRESH_TIMEOUT_SECONDS=${READ_MODEL_REFRESH_TIMEOUT_SECONDS:-30}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-10080}
      - ALLOW_PUBLIC_OBSERVABILITY_ENDPOINTS=${ALLOW_PUBLIC_OBSERVABILITY_ENDPOINTS:-false}
      - OBSERVABILITY_TOKEN=${OBSERVABILITY_TOKEN:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - SERVER_READ_TIMEOUT_SECONDS=${SERVER_READ_TIMEOUT_SECONDS:-30}
      - SERVER_READ_HEADER_TIMEOUT_SECONDS=${SERVER_READ_HEADER_TIMEOUT_SECONDS:-10}
      - SERVER_WRITE_TIMEOUT_SECONDS=${SERVER_WRITE_TIMEOUT_SECONDS:-30}
      - SERVER_IDLE_TIMEOUT_SECONDS=${SERVER_IDLE_TIMEOUT_SECONDS:-120}
      - SERVER_SHUTDOWN_TIMEOUT_SECONDS=${SERVER_SHUTDOWN_TIMEOUT_SECONDS:-20}
      - BACKGROUND_SHUTDOWN_TIMEOUT_SECONDS=${BACKGROUND_SHUTDOWN_TIMEOUT_SECONDS:-60}
      - READYZ_ALLOW_REDIS_DEGRADED=${READYZ_ALLOW_REDIS_DEGRADED:-false}
      - CHECK_USAGE_PAUSE_AFTER=${CHECK_USAGE_PAUSE_AFTER:-15m}
      - API_UPLOAD_MAX_BODY_BYTES=${API_UPLOAD_MAX_BODY_BYTES:-10485760}
      - API_JSON_MAX_BODY_BYTES=${API_JSON_MAX_BODY_BYTES:-1048576}
      - API_MULTIPART_MEMORY_BYTES=${API_MULTIPART_MEMORY_BYTES:-1048576}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - redisUrl=${REDIS_URL:-redis://redis:6379}
      - REDIS_MODE=${REDIS_MODE:-single}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-magpie-master}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}
      - SCRAPER_PAGE_POOL_MAX_CAPACITY=${SCRAPER_PAGE_POOL_MAX_CAPACITY:-4}
      - SCRAPER_POST_PROCESS_QUEUE_CAPACITY=${SCRAPER_POST_PROCESS_QUEUE_CAPACITY:-16}
      - PROXY_EXPORT_TIMEOUT_SECONDS=${PROXY_EXPORT_TIMEOUT_SECONDS:-300}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-magpie}
      - DB_USERNAME=${DB_USERNAME:-magpie_user}
      - DB_PASSWORD=${DB_PASSWORD:-ChangeMeToAStrongDbPassword}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-false}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALLOW_PRIVATE_NETWORK_EGRESS=${ALLOW_PRIVATE_NETWORK_EGRESS:-false}
      - PASSWORD_RESET_TOKEN_TTL_MINUTES=${PASSWORD_RESET_TOKEN_TTL_MINUTES:-}
      - WORKSPACE_INVITATION_TTL_HOURS=${WORKSPACE_INVITATION_TTL_HOURS:-168}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5050,http://127.0.0.1:5050,http://localhost:4200,http://127.0.0.1:4200}
      - DISABLE_PUBLIC_REGISTRATION=${DISABLE_PUBLIC_REGISTRATION:-}
      - ENABLE_PUBLIC_FIRST_ADMIN_BOOTSTRAP=${ENABLE_PUBLIC_FIRST_ADMIN_BOOTSTRAP:-}
      - ALLOW_INSECURE_REGISTRATION_DEFAULTS=${ALLOW_INSECURE_REGISTRATION_DEFAULTS:-true}
    depends_on:
      backend-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_browser_cache:/home/nonroot/.cache/rod
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.00}"
          memory: "${BACKEND_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${BACKEND_CPU_RESERVATION:-0.50}"
          memory: "${BACKEND_MEMORY_RESERVATION:-256M}"
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-90s}

  frontend:
    image: ${MAGPIE_FRONTEND_IMAGE:-kuuchen/magpie-frontend}:${MAGPIE_FRONTEND_TAG:-${MAGPIE_IMAGE_TAG:-latest}}
    container_name: magpie_frontend
    environment:
      - EXPORT_PROXY_READ_TIMEOUT_SECONDS=${EXPORT_PROXY_READ_TIMEOUT_SECONDS:-310}
    ports:
      - "5050:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-1.00}"
          memory: "${FRONTEND_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${FRONTEND_CPU_RESERVATION:-0.25}"
          memory: "${FRONTEND_MEMORY_RESERVATION:-128M}"
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: magpie_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-magpie_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMeToAStrongDbPassword}
      POSTGRES_DB: ${DB_NAME:-magpie}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.50}"
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION:-0.50}"
          memory: "${POSTGRES_MEMORY_RESERVATION:-256M}"
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: magpie_redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --masterauth "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:8946:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.00}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-0.25}"
          memory: "${REDIS_MEMORY_RESERVATION:-128M}"
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_browser_cache:
