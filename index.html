    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Magpie?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Magpie is a self-hosted, multi-user proxy manager. It collects proxies from web sources and imports, checks which ones work, tracks their health and reputation, and serves the healthy ones through rotating proxy endpoints."
            }
          },
          {
            "@type": "Question",
            "name": "How do I install Magpie?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Run the one-command installer for macOS, Linux, or Windows PowerShell. It creates a magpie/ directory, generates credentials, and starts the stack with Docker Compose. You can also clone the repository and run Docker Compose yourself."
            }
          },
          {
            "@type": "Question",
            "name": "Does installing Magpie give me a working proxy pool?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Magpie manages the proxies you import or discover from sources you configure. It does not ship a proxy pool."
            }
          },
          {
            "@type": "Question",
            "name": "Which protocols are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HTTP, HTTPS, SOCKS4, and SOCKS5 proxies. Rotating endpoints support TCP, QUIC, and HTTP/3 transports where applicable. IPv4, IPv6, and provider hostnames can be imported, checked, and rotated."
            }
          },
          {
            "@type": "Question",
            "name": "Can my team share one Magpie instance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Accounts join workspaces with owner, admin, operator, or viewer roles. Workspaces own the proxies, rotating endpoints, and alert rules."
            }
          },
          {
            "@type": "Question",
            "name": "Why does PROXY_ENCRYPTION_KEY matter?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It encrypts proxy credentials stored in PostgreSQL. Keep it unchanged and backed up. If it changes or is lost, previously stored credentials cannot be decrypted."
            }
          },
          {
            "@type": "Question",
            "name": "Is Magpie open source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Magpie is licensed under the GNU Affero General Public License v3.0."
            }
          }
        ]
      }
