        "@context": "https://schema.org",

        "description": "Open-source, multi-user proxy manager that checks your proxies, shows which ones work, and serves the healthy ones through rotating endpoints.",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Magpie?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Magpie is an open-source, multi-user proxy manager. You import your proxies, it keeps checking which ones work, tracks their health and reputation, and serves the healthy ones through rotating proxy endpoints. You can self-host it today, and a hosted version is in development."
            }
          },
          {
            "@type": "Question",
            "name": "Does Magpie sell proxies?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Magpie manages the proxies you bring from any provider. It does not sell or ship a proxy pool."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a hosted version?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not yet. Hosted Magpie is in development and will run on dedicated servers in the EU. The pricing page shows the planned launch pricing, which may change before launch."
            }
          },
          {
            "@type": "Question",
            "name": "Will self-hosting stay free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Magpie is licensed under the GNU Affero General Public License v3.0, and you can run it on your own servers at no cost. Hosted plans pay for running it for you."
            }
          },
          {
            "@type": "Question",
            "name": "How do I self-host Magpie?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Run the one-command installer for macOS, Linux, or Windows PowerShell. It creates a magpie/ directory, generates credentials, and starts the stack with Docker Compose. You can also clone the repository and run Docker Compose yourself."
            }
          },
          {
            "@type": "Question",
            "name": "Which protocols are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HTTP, HTTPS, SOCKS4, and SOCKS5 proxies. Rotating endpoints support TCP, QUIC, and HTTP/3 transports where applicable. IPv4, IPv6, and provider hostnames can be imported, checked, and rotated."
            }
          },
          {
            "@type": "Question",
            "name": "Can my team share one workspace?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Accounts join workspaces with owner, admin, operator, or viewer roles. Workspaces own the proxies, rotating endpoints, and alert rules."
            }
          },
          {
            "@type": "Question",
            "name": "How are proxy credentials stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Proxy usernames and passwords are encrypted in PostgreSQL with PROXY_ENCRYPTION_KEY. If you self-host, keep that key unchanged and backed up. If it changes or is lost, previously stored credentials cannot be decrypted."
            }
          }
        ]
      }
